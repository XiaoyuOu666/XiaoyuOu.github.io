- title: Research Experience
  type: nested_list
  contents:
    - title: Finite-Blocklength Communications and URLLC
      items:
        - Characterizing achievable rates and decoding error probabilities in short-packet wireless communications.
        - Investigating reliability, latency, and throughput trade-offs and their implications for transmission design in ultra-reliable low-latency communications systems.
        - Optimizing coding rates, blocklength, and power allocation to improve reliability and transmission efficiency.
    - title: Multiuser MIMO and Interference Management
      items:
        - Designing precoding and receive-combining schemes for multiuser MIMO systems to separate user signals and reduce inter-user interference.
        - Investigating the effects of spatial correlation, polarization, and imperfect channel state information on interference management and transceiver design.
        - Developing low-complexity resource allocation algorithms for multiuser MIMO systems with rate-splitting multiple access and non-orthogonal multiple access.
    - title: SDR Prototyping and Over-the-Air Validation
      items:
        - Implementing multiuser algorithms on USRP X310 SDR testbeds using Python/UHD and MATLAB.
        - Developing device synchronization, channel estimation, and multiuser precoding.
        - Evaluating performance through over-the-air experiments under practical wireless conditions.

