- title: Research Experience
  type: nested_list
  contents:
    - title: Finite-Blocklength Communications and URLLC
      items:
        - Studying reliability–latency–throughput trade-offs and optimizing short-packet encoding and resource allocation in massive MIMO and RSMA systems using convex optimization.
        - Quantifying sum-rate loss when infinite-blocklength resource allocations are applied to finite-blocklength transmission.
    - title: Multiuser MIMO and Interference Management
      items:
        - Designing RSMA transceivers with finite SIC and cancellation errors, and managing uplink interference in massive MIMO-NOMA through group-level SIC.
        - Developing SIC-free dual-polarized multiuser transmission over correlated Rician channels.
    - title: SDR Prototyping and Over-the-Air Validation
      items:
        - Implementing multiuser transmission and resource allocation algorithms on USRP X310 testbeds using Python/UHD and MATLAB.
        - Developing device synchronization, channel estimation, and multiuser precoding, with over-the-air performance evaluation.

