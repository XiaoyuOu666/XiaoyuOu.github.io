- number: "01"
  id: finite-blocklength
  title: Finite-Blocklength Communications and URLLC
  description: Characterizing reliability, latency, and throughput trade-offs in short-packet transmission, and investigating how finite-blocklength constraints shape system design and achievable performance.
  work:
    - studying reliability–latency–throughput trade-offs under finite blocklength constraints.
    - Comparing metadata and payload encoding schemes for reliable massive MIMO transmission.
    - Investigating sum-rate loss when infinite-blocklength resource allocations are used in the finite-blocklength regime.
  papers:
    - key: ou2026reliable
      title: Reliable Uplink Transmission for Low-Throughput Massive MIMO Networks With Finite Blocklength
      venue: IEEE Transactions on Communications
      year: 2026
    - key: ou2026mismatch
      title: On Mismatch of Sum-Rate Maximization Between Infinite and Finite Blocklength Regimes
      venue: IEEE Transactions on Signal Processing
      status: Under review
- number: "02"
  id: multiuser-mimo
  title: Multiuser MIMO and Interference Management
  description: Designing multiuser MIMO transceivers for RSMA and NOMA to manage inter-user interference and improve transmission efficiency.
  work:
    - Uplink multi-layer RSMA with finite successive interference cancellation (SIC).
    - Massive MIMO-NOMA with group-level SIC for URLLC services.
    - Dual-polarized multiuser transmission without SIC over correlated Rician channels.
  papers:
    - key: ou2026dual
      title: Uplink RSMA with Dual-Polarized Multi-User MIMO over Correlated Rician Channels in Finite Blocklength Regime
      venue: IEEE Transactions on Communications
      year: 2026
    - key: ou2025power
      title: Uplink Power Control for Massive MIMO-NOMA With Group-Level SIC in Massive URLLC Services
      venue: IEEE Transactions on Wireless Communications
      year: 2025
    - key: ou2024sum
      title: Sum Spectral Efficiency Maximization for Uplink Multi-Layer RSMA With Finite SIC
      venue: IEEE Wireless Communications Letters
      year: 2024
- number: "03"
  id: resource-optimization
  title: Low-Complexity Resource Optimization
  description: Developing low-complexity algorithms for precoding/combining, power control/allocation using convex optimization techniques.
  work:
    - Joint user scheduling, power allocation, and rate control for multicarrier RSMA.
    - Joint power, receive combining, and blocklength design for reliable massive MIMO.
    - Low-complexity transceiver and resource allocation algorithms using convex optimization.
  papers:
    - key: ou2025scheduling
      title: Joint User Scheduling, Power Allocation, and Rate Control for MC-RSMA in URLLC Services
      venue: IEEE Transactions on Vehicular Technology
      year: 2025
    - key: ou2023sic
      title: Resource Allocation in MU-MISO Rate-Splitting Multiple Access With SIC Errors for URLLC Services
      venue: IEEE Transactions on Communications
      year: 2023
- number: "04"
  id: sdr-validation
  title: SDR Prototyping and Over-the-Air Validation
  description: Implementing multiuser transmission and resource allocation algorithms on software-defined radio testbeds to evaluate their performance under practical wireless conditions.
  work:
    - Implementing multiuser algorithms on USRP X310 testbeds using Python/UHD and MATLAB.
    - Device synchronization, channel estimation, and multiuser precoding.
    - Over-the-air evaluation to connect theoretical designs with practical wireless conditions.
  platforms:
    - USRP X310
    - Python / UHD
    - MATLAB
